<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBridge | PinCode Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 60px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        header { background: #0f172a; color: #fff; padding: 24px 0; border-bottom: 3px solid #0284c7; }
        .navbar { display: flex; justify-content: space-between; align-items: center; }
        .logo h1 { font-size: 26px; color: #38bdf8; font-weight: 700; }
        .badge { background: #0284c7; color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; }
        .search-section { margin: 40px 0 30px; text-align: center; }
        .filter-box { display: flex; justify-content: center; margin-top: 24px; }
        .filter-box input { padding: 14px 18px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; outline: none; width: 320px; text-align: center; }
        .section-title { font-size: 22px; color: #0f172a; margin: 30px 0 16px; display: flex; align-items: center; gap: 10px; }
        .count-badge { background: #e0f2fe; color: #0369a1; font-size: 13px; padding: 4px 10px; border-radius: 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 24px; }
        .card { background: #fff; border-radius: 14px; padding: 24px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between; }
        .tag { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px; }
        .pin-tag { background: #fef3c7; color: #92400e; }
        .amount-tag { background: #dcfce7; color: #15803d; }
        .btn { display: inline-block; width: 100%; text-align: center; text-decoration: none; background: #0284c7; color: white; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="container navbar">
            <div class="logo">
                <h1>EduBridge</h1>
                <p>PinCode Based Scholarship Finder</p>
            </div>
            <span class="badge">PinCode Search</span>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <h2>Search Scholarships by <span>PinCode</span></h2>
            <p>Enter your 6-digit PinCode to view exact and nearby scholarships.</p>

            <div class="filter-box">
                <input type="text" id="pincodeInput" placeholder="Enter PinCode (e.g. 400001)..." maxlength="6">
            </div>
        </section>

        <!-- Exact Results -->
        <section>
            <div class="section-title">
                📍 Exact PinCode Results <span id="exactCount" class="count-badge">0</span>
            </div>
            <div id="exactGrid" class="grid"></div>
        </section>

        <!-- Nearby Results -->
        <section style="margin-top: 40px;">
            <div class="section-title">
                🗺️ Nearby PinCode Results <span id="nearbyCount" class="count-badge">0</span>
            </div>
            <div id="nearbyGrid" class="grid"></div>
        </section>
    </main>

    <script>
        const pincodeInput = document.getElementById('pincodeInput');
        const exactGrid = document.getElementById('exactGrid');
        const nearbyGrid = document.getElementById('nearbyGrid');
        const exactCount = document.getElementById('exactCount');
        const nearbyCount = document.getElementById('nearbyCount');

        function createCard(item) {
            let websiteBtn = (item.Website && item.Website !== 'N/A') 
                ? `<a href="${item.Website.startsWith('http') ? item.Website : 'https://' + item.Website}" target="_blank" class="btn">Visit Website</a>` 
                : `<span class="no-link">No Website Available</span>`;

            return `
                <div class="card">
                    <div>
                        <div class="card-header" style="display:flex; justify-content:space-between; margin-bottom:12px;">
                            <span class="tag pin-tag">📮 PinCode: ${item.PinCode || 'N/A'}</span>
                            <span class="tag amount-tag">${item.Amount || 'Amount Varies'}</span>
                        </div>
                        <h3 style="margin-bottom:10px;">${item.Name || 'N/A'}</h3>
                        <p style="margin-bottom:6px;"><strong>📍 Address:</strong> ${item.Address || 'N/A'}</p>
                        <p style="margin-bottom:6px;"><strong>📞 Contact:</strong> ${item.Contact || 'N/A'}</p>
                    </div>
                    <div style="margin-top:16px; padding-top:12px; border-top:1px solid #f1f5f9;">
                        ${websiteBtn}
                    </div>
                </div>
            `;
        }

        function fetchPinCodeData() {
            const pin = pincodeInput.value.trim();

            fetch(`/api/search?pincode=${encodeURIComponent(pin)}`)
                .then(response => response.json())
                .then(data => {
                    exactCount.innerText = data.exact.length;
                    exactGrid.innerHTML = data.exact.length === 0 
                        ? `<p style="color:#64748b;">No exact scholarships found for this PinCode.</p>` 
                        : data.exact.map(item => createCard(item)).join('');

                    nearbyCount.innerText = data.nearby.length;
                    nearbyGrid.innerHTML = data.nearby.length === 0 
                        ? `<p style="color:#64748b;">No nearby scholarships found.</p>` 
                        : data.nearby.map(item => createCard(item)).join('');
                })
                .catch(err => console.error("Error fetching data:", err));
        }

        pincodeInput.addEventListener('input', fetchPinCodeData);
        fetchPinCodeData();
    </script>
</body>
</html>
